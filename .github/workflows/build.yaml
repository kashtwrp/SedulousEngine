name: Build SedulousEngine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      config:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - ShippingRelease
          - Test
      project:
        description: 'Target project in Code/ workspace'
        required: true
        default: 'Sedulous.Tools.Editor'
        type: choice
        options:
          - Sedulous.Tools.Editor
          - Sedulous.Tools.Mcp
          - Sedulous.Tools.Cook
          - Sedulous.Tools.Export
          - Sedulous.Tools.ShaderPack
          - Samples.HelloWindow
          - Samples.Sandbox
          - Samples.GUISandbox
      run_tests:
        description: 'Run Sedulous.Core.Tests after building'
        required: false
        default: false
        type: boolean

env:
  BUILD_CONFIG: ${{ github.event.inputs.config || 'Release' }}
  TARGET_PROJECT: ${{ github.event.inputs.project || 'Sedulous.Tools.Editor' }}
  PLATFORM: Win64

jobs:
  build-windows:
    name: Build SedulousEngine (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup MSVC x64 C++ Build Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download and install Beef Nightly toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          Write-Host "Fetching latest Beef Nightly build list from https://nightly.beeflang.org/ ..."
          $nightlyPage = Invoke-WebRequest -Uri "https://nightly.beeflang.org/" -UseBasicParsing
          $match = [regex]::Match($nightlyPage.Content, 'BeefSetup_[0-9_]+\.exe')

          if ($match.Success) {
            $installerFile = $match.Value
            $downloadUrl = "https://nightly.beeflang.org/$installerFile"
          } else {
            # Fallback to known nightly build URL if page structure changes
            $downloadUrl = "https://nightly.beeflang.org/BeefSetup_0_43_6__11_04_2026.exe"
          }

          Write-Host "Downloading Beef Nightly installer from $downloadUrl ..."
          $installerPath = "$env:RUNNER_TEMP\BeefSetup.exe"
          curl.exe -L --retry 3 --fail -o "$installerPath" "$downloadUrl"

          Write-Host "Attempting silent installation of BeefSetup.exe..."
          $proc = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -PassThru
          if (-not $proc.WaitForExit(120000)) {
            Write-Warning "Installer timed out waiting for UI; stopping process and falling back to direct extraction..."
            $proc.Kill()
          }

          $beefExe = Get-ChildItem -Path "C:\Program Files\BeefLang", "C:\Program Files (x86)\BeefLang" -Filter "BeefBuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $beefExe) {
            Write-Host "BeefBuild.exe not found in Program Files; extracting installer directly..."
            $extractDir = "C:\BeefLang"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

            # Try 7-Zip extraction first
            & "C:\Program Files\7-Zip\7z.exe" x "$installerPath" -o"$extractDir" -y | Out-Null
            $beefExe = Get-ChildItem -Path $extractDir -Filter "BeefBuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

            # If Inno Setup container, extract with innoextract
            if (-not $beefExe) {
              Write-Host "Installing innoextract to unpack Inno Setup installer..."
              choco install innoextract -y --no-progress
              innoextract -d "$extractDir" "$installerPath"
              $beefExe = Get-ChildItem -Path $extractDir -Filter "BeefBuild.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }

          if (-not $beefExe) {
            Write-Error "Failed to locate BeefBuild.exe after installation/extraction."
            exit 1
          }

          $beefBin = $beefExe.DirectoryName
          Write-Host "Found BeefBuild.exe at: $($beefExe.FullName)"
          echo "$beefBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$($beefExe.FullName)" -version

      - name: Compile target project with BeefBuild
        shell: pwsh
        working-directory: Code
        run: |
          Write-Host "Building $env:TARGET_PROJECT ($env:BUILD_CONFIG | $env:PLATFORM)..."
          BeefBuild -config=$env:BUILD_CONFIG -platform=$env:PLATFORM -project=$env:TARGET_PROJECT -verbosity=normal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "BeefBuild failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Run unit tests (optional)
        if: ${{ github.event.inputs.run_tests == 'true' }}
        shell: pwsh
        working-directory: Code
        run: |
          Write-Host "Running Sedulous.Core.Tests..."
          BeefBuild -platform=$env:PLATFORM -test -project=Sedulous.Core.Tests
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tests failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Stage build output and runtime tools
        shell: pwsh
        run: |
          $buildOutputDir = "Code/build/$($env:BUILD_CONFIG)_$($env:PLATFORM)/$($env:TARGET_PROJECT)"
          New-Item -ItemType Directory -Force -Path "artifact_stage/bin" | Out-Null

          if (Test-Path $buildOutputDir) {
            Write-Host "Staging files from $buildOutputDir ..."
            Copy-Item -Path "$buildOutputDir/*" -Destination "artifact_stage/bin/" -Recurse -Force
          } else {
            Write-Warning "Default path $buildOutputDir not found; searching Code/build for compiled output..."
            $foundExe = Get-ChildItem -Path "Code" -Filter "$($env:TARGET_PROJECT).exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundExe) {
              Write-Host "Found compiled binary at $($foundExe.FullName)"
              Copy-Item -Path "$($foundExe.DirectoryName)/*" -Destination "artifact_stage/bin/" -Recurse -Force
            } else {
              Write-Error "Could not find compiled output for $env:TARGET_PROJECT"
              exit 1
            }
          }

          if (Test-Path "Bin") {
            Copy-Item -Path "Bin" -Destination "artifact_stage/Bin" -Recurse -Force
          }
          if (Test-Path "Dependencies/THIRD-PARTY-NOTICES.txt") {
            Copy-Item -Path "Dependencies/THIRD-PARTY-NOTICES.txt" -Destination "artifact_stage/bin/" -Force
          }

      - name: Upload compiled binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedulousEngine-${{ env.TARGET_PROJECT }}-${{ env.BUILD_CONFIG }}-${{ env.PLATFORM }}
          path: artifact_stage/
          if-no-files-found: error
          retention-days: 14
