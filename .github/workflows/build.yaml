name: Build SedulousEngine

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      config:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
          - ShippingRelease
          - Test
      project:
        description: 'Target project in Code/ workspace'
        required: true
        default: 'Sedulous.Tools.Editor'
        type: choice
        options:
          - Sedulous.Tools.Editor
          - Sedulous.Tools.Mcp
          - Sedulous.Tools.Cook
          - Sedulous.Tools.Export
          - Sedulous.Tools.ShaderPack
          - Samples.HelloWindow
          - Samples.Sandbox
          - Samples.GUISandbox
      run_tests:
        description: 'Run Sedulous.Core.Tests after building'
        required: false
        default: false
        type: boolean

env:
  # Default build settings when triggered by push or pull_request
  BUILD_CONFIG: ${{ github.event.inputs.config || 'Release' }}
  TARGET_PROJECT: ${{ github.event.inputs.project || 'Sedulous.Tools.Editor' }}
  PLATFORM: Win64

jobs:
  build-windows:
    name: Build (${{ inputs.project || 'Sedulous.Tools.Editor' }} - ${{ inputs.config || 'Release' }})
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Download and install Beef Nightly toolchain
        timeout-minutes: 10
        shell: pwsh
        run: |
          Write-Host "Downloading latest Beef Nightly installer from https://nightly.beeflang.org/BeefSetup.exe ..."
          $installerPath = "$env:RUNNER_TEMP\BeefSetup.exe"
          Invoke-WebRequest -Uri "https://nightly.beeflang.org/BeefSetup.exe" -OutFile $installerPath -UseBasicParsing

          Write-Host "Extracting BeefLang toolchain with 7-Zip..."
          $beefRoot = "C:\Program Files\BeefLang"
          7z x $installerPath -o"$beefRoot" -y

          # Locate BeefBuild.exe in case it extracts into a subfolder
          $beefBuild = Get-ChildItem -Path $beefRoot -Filter "BeefBuild.exe" -Recurse | Select-Object -First 1
          if (-not $beefBuild) {
            Write-Error "BeefBuild.exe was not found after extraction under $beefRoot"
            exit 1
          }

          $beefBin = $beefBuild.DirectoryName
          Write-Host "Adding $beefBin to PATH..."
          echo "$beefBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile target project with BeefBuild
        shell: pwsh
        working-directory: Code
        run: |
          # Per SedulousEngine AGENTS.md, always build ONE project at a time to avoid exhausting runner memory.
          Write-Host "Building $env:TARGET_PROJECT ($env:BUILD_CONFIG | $env:PLATFORM)..."
          BeefBuild -proddir=. -config=$env:BUILD_CONFIG -platform=$env:PLATFORM -project=$env:TARGET_PROJECT -verbosity=normal

      - name: Run unit tests (optional)
        if: ${{ github.event.inputs.run_tests == 'true' }}
        shell: pwsh
        working-directory: Code
        run: |
          Write-Host "Running Sedulous.Core.Tests..."
          BeefBuild -proddir=. -platform=$env:PLATFORM -test -project=Sedulous.Core.Tests

      - name: Stage build output and runtime tools
        shell: pwsh
        run: |
          $buildOutputDir = "Code/build/$($env:BUILD_CONFIG)_$($env:PLATFORM)/$($env:TARGET_PROJECT)"
          if (-not (Test-Path $buildOutputDir)) {
            Write-Error "Expected build output directory not found: $buildOutputDir"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "artifact_stage/bin" | Out-Null
          Copy-Item -Path "$buildOutputDir/*" -Destination "artifact_stage/bin/" -Recurse -Force

          # Include vendor shader tools (naga & tint) and third-party license notices alongside the binary
          if (Test-Path "Bin") {
            Copy-Item -Path "Bin" -Destination "artifact_stage/Bin" -Recurse -Force
          }
          if (Test-Path "Dependencies/THIRD-PARTY-NOTICES.txt") {
            Copy-Item -Path "Dependencies/THIRD-PARTY-NOTICES.txt" -Destination "artifact_stage/bin/" -Force
          }

      - name: Upload compiled binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedulousEngine-${{ env.TARGET_PROJECT }}-${{ env.BUILD_CONFIG }}-${{ env.PLATFORM }}
          path: artifact_stage/
          if-no-files-found: error
          retention-days: 14
